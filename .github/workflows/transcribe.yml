name: 转文字后台
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      sample_url:
        description: '可选：验证公开样例链接（不调用付费识别）'
        required: false
        type: string
  push:
    branches: [claude/clever-einstein-4j55to]
    paths: [scripts/transcription/**, .github/workflows/transcribe.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: transcription-worker
  cancel-in-progress: false
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/transcription/requirements.txt
      - run: python -m pip install -r scripts/transcription/requirements.txt
      - name: 检查音频工具
        run: command -v ffmpeg && command -v ffprobe
      - name: 处理等待中的文字稿
        env:
          XIMI_TRANSCRIBE_PROBE_URL: ${{ inputs.sample_url || (github.event_name == 'push' && 'https://www.bilibili.com/video/BV17x411w7KC') || '' }}
          XIMI_TRANSCRIBE_ENDPOINT: https://xrnqpwwomyzekjfhjixl.supabase.co/functions/v1/transcribe
        run: python scripts/transcription/worker.py
